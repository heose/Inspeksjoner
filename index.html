/* Feltverktøy: én kolonne, store trykkflater, signalfarger kun for status. */

  --accent: #058479; --accent-ink: #ffffff; --accent-soft: #d3ece8;
  --blue: #1d6fb8; --blue-soft: #e1eefa; --ok: #1a7a4c; --bad: #c0172f; --bad-soft: #fcebee; --na: #5e6c76; --warn: #9a6200; --warn-soft: #fbf0d9; --ok-soft: #e2f2e9;
  --act-bg: #fff5d1; --act-line: #e2bf3d; --act-ink: #5c4708;
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.74); --glass-line: rgba(255,255,255,.85);
  --glass-shadow: 0 12px 30px rgba(30,70,70,.12), inset 0 1px 0 rgba(255,255,255,.9);
  --blur: blur(22px) saturate(1.4); --seg-bg: rgba(14,35,33,.06); --seg-todo: rgba(14,35,33,.12);
  --glow-1: rgba(5,132,121,.40); --glow-2: rgba(84,140,230,.30); --glow-3: rgba(240,190,120,.48);
  --tag: #f2c230; --tag-ink: #241b00;
  --ok-fill: #1a7a4c; --bad-fill: #c0172f; --na-fill: #5e6c76;   /* fylte knapper med hvit tekst (AA i begge temaer) */
  --font: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --display: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #081413; --surface: #13201f; --surface-2: rgba(255,255,255,.08); --ink: #eaf3f1; --muted: #a6bcb8; --line: rgba(255,255,255,.12);
    --accent: #2fc2b2; --accent-ink: #06201d; --accent-soft: #14332f;
    --blue: #5aaaf0; --blue-soft: #14283b; --ok: #3daf74; --bad: #ee5a6e; --bad-soft: #3a1d23; --na: #7f8d96; --warn: #e3a743; --warn-soft: #36290f; --ok-soft: #15301f;
    --act-bg: #2e2812; --act-line: #8a7121; --act-ink: #f0d98a;
    --glass: rgba(255,255,255,.07); --glass-strong: rgba(18,32,31,.78); --glass-line: rgba(255,255,255,.14);
    --glass-shadow: 0 16px 38px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    --seg-bg: rgba(255,255,255,.06); --seg-todo: rgba(255,255,255,.14);
    --ok-fill: #1f7f50; --bad-fill: #c4223b; --na-fill: #5e6c76;
    --glow-1: rgba(47,194,178,.30); --glow-2: rgba(84,120,230,.26); --glow-3: rgba(240,160,90,.18);
    color-scheme: dark;
  }
}

.ib-cat.hi { background:var(--bad-soft, #fdecec); color:var(--bad, #c62f2c); }
